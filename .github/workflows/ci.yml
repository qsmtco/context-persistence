name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: plugins/context-persistence/package-lock.json

      - name: Install dependencies
        run: |
          cd plugins/context-persistence
          npm ci

      - name: Run lint
        run: |
          cd plugins/context-persistence
          npx eslint . --max-warnings 0 || echo "No ESLint config"
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          cd plugins/context-persistence
          npm test -- --coverage --coverage.reporter=lcov --coverage.reporter=text-summary

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: plugins/context-persistence/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Check coverage thresholds
        run: |
          cd plugins/context-persistence
          # Extract coverage percentages from text-summary output
          COVERAGE=$(npm test -- --coverage 2>&1 | grep -oP 'All files[^0-9]*\K[0-9.]+' || echo "0")
          echo "Overall statement coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "Coverage below 90% threshold"
            exit 1
          fi
        continue-on-error: false

  # Optional: performance benchmarks
  perf:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          cd plugins/context-persistence
          npm ci
          npm run test:perf
        name: Run performance benchmarks
